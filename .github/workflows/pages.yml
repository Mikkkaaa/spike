name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools
      - name: Build practice_3
        run: SITE_URL=https://mikkkaaa.github.io/spike/practice_3/ python3 practice_3/build.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R practice_3/dist _site/practice_3
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=practice_3/"><a href="practice_3/">Spike: лендинг</a>' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
